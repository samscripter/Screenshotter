<!DOCTYPE html>
<html>
<head>
    <title>Color Change Test</title>
    <style>
        .indicator {
            width: 50px;
            height: 50px;
            border: 2px solid black;
            display: inline-block;
            margin: 10px;
            transition: background-color 0.5s;
        }
        #rsi-indicator {
            background-color: red;
        }
    </style>
</head>
<body>
    <h1>TradingView RSI Simulator</h1>
    <div class="indicator" id="rsi-indicator"></div>
    <p>RSI Indicator - Changes color every 5 seconds</p>
    <button onclick="changeColor()">Manual Color Change</button>

    <script>
        let isRed = true;

        function changeColor() {
            const indicator = document.getElementById('rsi-indicator');
            if (isRed) {
                indicator.style.backgroundColor = 'green';
                isRed = false;
            } else {
                indicator.style.backgroundColor = 'red';
                isRed = true;
            }
        }

        // Auto change color every 5 seconds
        setInterval(changeColor, 5000);
    </script>
</body>
</html>
